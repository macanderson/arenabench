AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ArenaBench core infrastructure: scale-to-zero benchmark compute (AWS Batch),
  SUT binary builds from any git ref (CodeBuild), artifact/trace storage (S3),
  run metadata (DynamoDB), and the GitHub OIDC deploy role CI assumes.
  Designed for ArenaBench as a standalone repository: the system under test is
  always fetched by git URL + ref, never by local path. The web control plane
  is its own stack (infra/web.yaml), which only reads what this one owns.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for Batch compute instances (default VPC is fine).
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Public subnets for Batch instances. Public-subnet egress is deliberate:
      a NAT gateway would bill hourly while idle, which violates the
      scale-to-zero posture. The security group allows no ingress.
  SutGitUrl:
    Type: String
    Default: https://github.com/macanderson/stella.git
    Description: Default git remote for SUT (system under test) binary builds.
  InfraGitUrl:
    Type: String
    Default: https://github.com/macanderson/arenabench.git
    Description: >-
      Git remote holding the ArenaBench package and this infra directory —
      the standalone arenabench repository.
  PkgPath:
    Type: String
    Default: "."
    Description: >-
      Path of the ArenaBench package inside InfraGitUrl's repo. "." now that
      ArenaBench is its own repository; a fork that vendors ArenaBench into
      a subdirectory sets this to that subdirectory.
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether this stack creates the token.actions.githubusercontent.com
      OIDC provider. An AWS account can hold exactly one provider per URL,
      so set "false" if another stack or a hand-made provider already owns
      it; the deploy role then binds to that existing provider (its ARN is
      the same either way).
  OnDemandMaxvCpus:
    Type: Number
    Default: 384
    Description: >-
      Ceiling for the measurement compute environment. 12 agents x 12-task
      concurrency at 2 vCPU per trial is 288 vCPU; 384 leaves headroom.
      The account's EC2 on-demand vCPU quota is the real limit.
  SpotMaxvCpus:
    Type: Number
    Default: 256
  GpuMaxvCpus:
    Type: Number
    Default: 64
  SutBuildComputeType:
    Type: String
    Default: BUILD_GENERAL1_LARGE
    AllowedValues:
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE
      - BUILD_GENERAL1_2XLARGE
  LogRetentionDays:
    Type: Number
    Default: 30

Conditions:
  CreateGitHubOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  # ---------------------------------------------------------------- storage
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub arenabench-artifacts-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart
            Status: Enabled
            Prefix: ""
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-build-cache
            Status: Enabled
            Prefix: cache/
            ExpirationInDays: 30

  RunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: arenabench
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  RunnerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: arenabench/runner
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }

  BatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /arenabench/batch
      RetentionInDays: !Ref LogRetentionDays

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /arenabench/build
      RetentionInDays: !Ref LogRetentionDays

  # ------------------------------------------------------------- codebuild
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: arenabench-codebuild
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: arenabench-codebuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${BuildLogGroup.Arn}:*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub ${ArtifactsBucket.Arn}/*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt RunnerRepository.Arn

  # Builds the SUT binary from any git ref (default: tip of main) and drops
  # it in S3 under binaries/<ref>/<sha>/stella, mirroring sut_build.py's
  # zigbuild recipe so the artifact is glibc-2.17 portable.
  SutBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: arenabench-sut-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      TimeoutInMinutes: 90
      Artifacts:
        Type: NO_ARTIFACTS
      Cache:
        Type: S3
        Location: !Sub ${ArtifactsBucket}/cache/sut-build
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
          StreamName: sut-build
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref SutBuildComputeType
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: GIT_URL
            Value: !Ref SutGitUrl
          - Name: GIT_REF
            Value: main
          - Name: ARTIFACTS_BUCKET
            Value: !Ref ArtifactsBucket
          - Name: TARGET_TRIPLE
            Value: x86_64-unknown-linux-gnu
          - Name: GLIBC_FLOOR
            Value: "2.17"
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
                - pip3 install --quiet cargo-zigbuild
            build:
              commands:
                - export PATH="$HOME/.cargo/bin:$PATH"
                - git clone --filter=blob:none "$GIT_URL" /tmp/sut-src
                - cd /tmp/sut-src && git checkout "$GIT_REF"
                - export SHA="$(git rev-parse HEAD)"
                - export REF_SAFE="$(printf '%s' "$GIT_REF" | tr '/' '-')"
                - TOOLCHAIN="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
                - rustup toolchain install "$TOOLCHAIN" --profile minimal
                - rustup default "$TOOLCHAIN"
                - rustup target add "$TARGET_TRIPLE"
                - export CARGO_TARGET_DIR=/root/target
                - export STELLA_BUILD_GIT_SHA="$SHA"
                - cargo zigbuild --release --locked --target "$TARGET_TRIPLE.$GLIBC_FLOOR" -p stella-cli --bin stella
            post_build:
              commands:
                - cd /tmp/sut-src
                - BIN="/root/target/$TARGET_TRIPLE/release/stella"
                - test -f "$BIN"
                - BSHA="$(sha256sum "$BIN" | cut -d' ' -f1)"
                - aws s3 cp "$BIN" "s3://$ARTIFACTS_BUCKET/binaries/$REF_SAFE/$SHA/stella"
                - printf '{"git_ref":"%s","commit":"%s","sha256":"%s","glibc_floor":"%s","built_at":"%s"}\n' "$GIT_REF" "$SHA" "$BSHA" "$GLIBC_FLOOR" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/manifest.json
                - aws s3 cp /tmp/manifest.json "s3://$ARTIFACTS_BUCKET/binaries/$REF_SAFE/$SHA/manifest.json"
                - aws s3 cp /tmp/manifest.json "s3://$ARTIFACTS_BUCKET/binaries/$REF_SAFE/latest.json"
          cache:
            paths:
              - /root/.cargo/**/*
              - /root/target/**/*

  # Builds the trial runner image (docker-in-docker + arenabench + agent
  # CLIs) from the repo's infra/runner/Dockerfile and pushes it to ECR.
  RunnerImageProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: arenabench-runner-image
      ServiceRole: !GetAtt CodeBuildRole.Arn
      TimeoutInMinutes: 45
      Artifacts:
        Type: NO_ARTIFACTS
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
          StreamName: runner-image
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: GIT_URL
            Value: !Ref InfraGitUrl
          - Name: GIT_REF
            Value: main
          - Name: PKG_PATH
            Value: !Ref PkgPath
          # The Stella seat's Harbor adapter is fetched at image-build time
          # from the Stella repository (this repo no longer vendors it);
          # override STELLA_ADAPTER_REF at start-build to pin a branch/tag.
          - Name: STELLA_GIT_URL
            Value: https://github.com/macanderson/stella.git
          - Name: STELLA_ADAPTER_REF
            Value: main
          - Name: ECR_URI
            Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/arenabench/runner
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_URI%%/*}"
            build:
              commands:
                - git clone --filter=blob:none "$GIT_URL" /tmp/src
                - cd /tmp/src && git checkout "$GIT_REF"
                - export SHA="$(git rev-parse HEAD)"
                - docker build -f "$PKG_PATH/infra/runner/Dockerfile" --build-arg "PKG_PATH=$PKG_PATH" --build-arg "STELLA_GIT_URL=$STELLA_GIT_URL" --build-arg "STELLA_ADAPTER_REF=$STELLA_ADAPTER_REF" -t "$ECR_URI:latest" -t "$ECR_URI:$SHA" .
            post_build:
              commands:
                - docker push "$ECR_URI:latest"
                - docker push "$ECR_URI:$SHA"

  # ------------------------------------------------------------------ batch
  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ArenaBench Batch instances - egress only, no ingress.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: arenabench

  EcsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: arenabench-ecs-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: arenabench-ecs-instance
      Roles:
        - !Ref EcsInstanceRole

  # 200 GB gp3 root: each instance hosts up to a dozen docker-in-docker
  # trials, and task images plus recordings need real scratch space.
  InstanceLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: arenabench-batch-instance
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 200
              VolumeType: gp3
              DeleteOnTermination: true
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Project
                Value: arenabench

  # The three compute environments are deliberately left unnamed.
  #
  # Batch treats most ComputeResources edits — instance types above all — as
  # requiring a *replacement* of the compute environment, and CloudFormation
  # cannot replace a resource that carries an explicit name, because the new
  # one would collide with the old before the old is gone. A custom name
  # therefore converts an ordinary tuning change into `CloudFormation cannot
  # update a stack when a custom-named resource requires replacing. Rename
  # ... and update the stack again` — a rollback, and a rename in the
  # template for every future change. That is exactly how the deploy of the
  # one-trial-per-instance fix failed the first time.
  #
  # Unnamed, CloudFormation replaces them cleanly: it creates the new
  # environment, repoints the queue at it, then deletes the old one. Nothing
  # external addresses a compute environment anyway — submissions and every
  # runbook name the *queues* (arenabench-measure / -burst / -tune), which
  # keep their stable names and are unaffected by a replacement underneath.
  # The generated names are published as stack outputs for the console.
  OnDemandComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        DesiredvCpus: 0
        MaxvCpus: !Ref OnDemandMaxvCpus
        # Exactly one size, and it is the trial's size on purpose: a trial
        # requests 4 vCPU, an m6i.xlarge *has* 4 vCPU, so Batch can never
        # place two trials on one instance. That is a correctness
        # requirement, not a tuning choice — see TrialTopology below.
        InstanceTypes:
          - m6i.xlarge
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt EcsInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref InstanceLaunchTemplate
          Version: !GetAtt InstanceLaunchTemplate.LatestVersionNumber
        Ec2Configuration:
          - ImageType: ECS_AL2023
        Tags:
          Project: arenabench

  SpotComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_PRICE_CAPACITY_OPTIMIZED
        MinvCpus: 0
        DesiredvCpus: 0
        MaxvCpus: !Ref SpotMaxvCpus
        # One trial per instance here too: the netns collision is a property
        # of the runner, not of the purchase model.
        InstanceTypes:
          - m6i.xlarge
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt EcsInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref InstanceLaunchTemplate
          Version: !GetAtt InstanceLaunchTemplate.LatestVersionNumber
        Ec2Configuration:
          - ImageType: ECS_AL2023
        Tags:
          Project: arenabench

  # GPU capacity for the tuning loop. Provisioned at zero idle cost; the
  # account's G/VT vCPU quota (0 at deploy time) must be raised before jobs
  # placed here can start.
  GpuComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        DesiredvCpus: 0
        MaxvCpus: !Ref GpuMaxvCpus
        InstanceTypes:
          - g6e
          - g6
          - g5
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt EcsInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref InstanceLaunchTemplate
          Version: !GetAtt InstanceLaunchTemplate.LatestVersionNumber
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        Tags:
          Project: arenabench

  # Measured comparisons run on-demand only: a spot interruption mid-trial
  # is a confound, not a saving.
  MeasureQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: arenabench-measure
      State: ENABLED
      Priority: 100
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref OnDemandComputeEnvironment

  BurstQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: arenabench-burst
      State: ENABLED
      Priority: 50
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref SpotComputeEnvironment

  TuneQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: arenabench-tune
      State: ENABLED
      Priority: 10
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref GpuComputeEnvironment

  TrialJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: arenabench-trial-job
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: arenabench-trial-job
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactsBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${ArtifactsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt RunsTable.Arn
                  - !Sub ${RunsTable.Arn}/index/*
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/arenabench/*
              # Every credential under /arenabench is a SecureString, and
              # reading one is two authorizations, not one: SSM returns the
              # ciphertext and KMS decrypts it. Without this the job is
              # allowed to fetch a parameter it can never read, and the
              # failure surfaces nowhere near its cause — the run's eight
              # trials each staged the SUT, then died exit 2 on "required
              # environment variables are not set: any of OPENROUTER_API_KEY",
              # which reads as a match-file mistake rather than an IAM one.
              # `kms:ViaService` keeps the grant to decryption performed on
              # this role's behalf BY Parameter Store: the job can read the
              # secrets it is entitled to and cannot use the key for anything
              # else. The alias is the account's AWS-managed SSM key, whose
              # own key policy already requires the caller be in this account.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

  TrialJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: arenabench-trial
      Type: container
      PlatformCapabilities:
        - EC2
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: 10800
      ContainerProperties:
        Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/arenabench/runner:latest
        JobRoleArn: !GetAtt TrialJobRole.Arn
        Privileged: true
        # The inner dockerd cannot stack overlayfs on the container's own
        # overlay root (EINVAL); it needs a data root on a real filesystem.
        # The entrypoint carves a per-job subdirectory under this host
        # volume, which also keeps a crashed job from stranding storage that
        # the next job on a reused instance would inherit.
        Volumes:
          - Name: dind-scratch
            Host:
              SourcePath: /var/lib/arenabench-scratch
        MountPoints:
          - SourceVolume: dind-scratch
            ContainerPath: /scratch
        # TrialTopology: one trial per EC2 instance, enforced from both ends.
        #
        # Batch runs EC2 jobs with ECS `networkMode: host`, so every trial
        # container on an instance shares the *host* network namespace. A
        # trial boots its own dockerd, and Docker's filter chains
        # (DOCKER-BRIDGE, DOCKER-FORWARD, ...) are globally-named per
        # namespace: the first dockerd creates them and every later one dies
        # with `iptables: Chain already exists`. Storage isolation (above)
        # does not help, because the namespace is what is shared.
        #
        # So the request below is deliberately the *whole* m6i.xlarge —
        # 4 of its 4 vCPUs — which is what makes double-placement
        # unrepresentable rather than merely unlikely. The compute
        # environments pin that one instance size for the same reason.
        # Lowering either number without giving each dockerd its own network
        # namespace reintroduces the collision.
        #
        # This costs nothing: m6i pricing is linear in size, so 4 xlarge
        # instances and 1 m6i.4xlarge bill the same per vCPU-hour, and one
        # trial per box additionally removes the CPU contention that skews
        # timeout-bound tasks when two agents race on one instance.
        ResourceRequirements:
          - Type: VCPU
            Value: "4"
          - Type: MEMORY
            Value: "15360"
        Command:
          - smoke
        Environment:
          - Name: ARTIFACTS_BUCKET
            Value: !Ref ArtifactsBucket
          - Name: ARENABENCH_TABLE
            Value: !Ref RunsTable
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref BatchLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: trial

  # The Vercel OIDC provider and arenabench-vercel-web role sat here
  # until the web plane moved to AWS (infra/web.yaml): the Vercel
  # deployment is retired per the SaaS spec §9.4, and stella#2254's
  # SecureString question is answered by this deletion.

  # ----------------------------------------------------------- github oidc
  # CI deploys of this very stack: .github/workflows/infra.yml assumes
  # arenabench-deploy via GitHub's OIDC issuer — no long-lived keys in the
  # repository. Chicken-and-egg by construction: the role is created by the
  # stack it deploys, so the FIRST deploy (and any change to this role's own
  # policy that the old policy does not permit) is a manual, admin-run
  # deploy; after that CI owns the stack. See infra/README.md.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # Since 2023 AWS validates GitHub's issuer against its own trust store
      # and ignores these thumbprints, but the API still requires the field;
      # these are GitHub's published intermediate thumbprints.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: arenabench-deploy
      # The provider ARN is spelled out rather than !GetAtt'd so the role
      # still resolves when CreateGitHubOidcProvider=false and the provider
      # belongs to another stack — the ARN is determined by the URL alone.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              StringLike:
                "token.actions.githubusercontent.com:sub":
                  # Pushes to main, and jobs that declare `environment: infra`
                  # (an environment claim replaces the ref claim in `sub`).
                  - repo:macanderson/arenabench:ref:refs/heads/main
                  - repo:macanderson/arenabench:environment:infra
      Policies:
        - PolicyName: arenabench-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # This stack, and the web-plane stack the same workflow
              # deploys (infra/web.yaml).
              - Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/arenabench-core/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/arenabench-web/*
              - Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*" # ValidateTemplate takes no resource ARN.
              # CloudFormation mutates resources with the caller's own
              # credentials (no service role is passed), so everything the
              # template manages must be grantable here. Each family is
              # scoped as tightly as its API allows; where a statement is
              # broad the comment says why.
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/arenabench-*
              # Self-referential on purpose: arenabench-deploy matches
              # arenabench-*, so CI can evolve every role in this template
              # including its own. That is inherent to a self-mutating
              # stack — the alternative (excluding this role) would make
              # every edit to this policy a manual deploy forever.
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/arenabench-*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - batch.amazonaws.com
                      - codebuild.amazonaws.com
                      - ec2.amazonaws.com
                      - ecs-tasks.amazonaws.com
              - Effect: Allow
                Action:
                  - iam:AddRoleToInstanceProfile
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:UntagInstanceProfile
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/arenabench-*
              # GitHub's provider, which this template manages — plus the
              # retired Vercel provider's path, kept only so a CI deploy can
              # finish deleting it from an account that still holds one.
              - Effect: Allow
                Action:
                  - iam:AddClientIDToOpenIDConnectProvider
                  - iam:CreateOpenIDConnectProvider
                  - iam:DeleteOpenIDConnectProvider
                  - iam:GetOpenIDConnectProvider
                  - iam:ListOpenIDConnectProviderTags
                  - iam:RemoveClientIDFromOpenIDConnectProvider
                  - iam:TagOpenIDConnectProvider
                  - iam:UntagOpenIDConnectProvider
                  - iam:UpdateOpenIDConnectProviderThumbprint
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/oidc.vercel.com/*
                  - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
              # Bucket-level only (no /*): the deploy role configures the
              # bucket (encryption, lifecycle, public-access block — a long
              # and churning action list, hence s3:*) but is deliberately
              # not granted object read/write — except the one prefix the
              # web deploy writes its Lambda zip to.
              - Effect: Allow
                Action: s3:*
                Resource: !Sub arn:aws:s3:::arenabench-artifacts-${AWS::AccountId}
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::arenabench-artifacts-${AWS::AccountId}/cache/web/*
              # The web-plane stack's own resource families (infra/web.yaml):
              # one Lambda, an HTTP API with two custom domains, a
              # DNS-validated certificate, and alias records in the
              # arenabench.org hosted zone. apigateway's IAM surface is
              # path-shaped, hence the /apis* + /domainnames* pair; ACM
              # tickets carry no name until created, hence "*" bounded by
              # the action list (no export of private keys exists in ACM).
              - Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:arenabench-*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/arenabench-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/domainnames*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/tags*
              - Effect: Allow
                Action:
                  - acm:AddTagsToCertificate
                  - acm:DeleteCertificate
                  - acm:DescribeCertificate
                  - acm:ListTagsForCertificate
                  - acm:RemoveTagsFromCertificate
                  - acm:RequestCertificate
                Resource: "*"
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                Resource: arn:aws:route53:::hostedzone/*
              - Effect: Allow
                Action:
                  - route53:GetChange
                  - route53:ListHostedZones
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/arenabench
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/arenabench/index/*
              - Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteLifecyclePolicy
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:GetLifecyclePolicy
                  - ecr:ListTagsForResource
                  - ecr:PutLifecyclePolicy
                  - ecr:TagResource
                  - ecr:UntagResource
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/arenabench/*
              # Batch offers no useful resource-level scoping for stack
              # management: the compute environments are deliberately
              # unnamed (see OnDemandComputeEnvironment) so their ARNs
              # cannot be predicted, and Describe* are list calls. Bounded
              # by the action list instead — no SubmitJob/TerminateJob here.
              - Effect: Allow
                Action:
                  - batch:CreateComputeEnvironment
                  - batch:CreateJobQueue
                  - batch:DeleteComputeEnvironment
                  - batch:DeleteJobQueue
                  - batch:DeregisterJobDefinition
                  - batch:DescribeComputeEnvironments
                  - batch:DescribeJobDefinitions
                  - batch:DescribeJobQueues
                  - batch:RegisterJobDefinition
                  - batch:TagResource
                  - batch:UntagResource
                  - batch:UpdateComputeEnvironment
                  - batch:UpdateJobQueue
                Resource: "*"
              - Effect: Allow
                Action:
                  - codebuild:BatchGetProjects
                  - codebuild:CreateProject
                  - codebuild:DeleteProject
                  - codebuild:UpdateProject
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/arenabench-*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DeleteRetentionPolicy
                  - logs:ListTagsForResource
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/arenabench/*
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*" # DescribeLogGroups is a list call; no resource ARN.
              # EC2's create/tag calls demand multi-resource ARN lists plus
              # request-tag conditions that churn with every template edit,
              # and its Describe* accept no resource ARNs at all. Bounded by
              # the action list instead: security group, launch template,
              # and tag verbs only — no RunInstances, no instance mutation.
              - Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:CreateLaunchTemplate
                  - ec2:CreateLaunchTemplateVersion
                  - ec2:CreateSecurityGroup
                  - ec2:CreateTags
                  - ec2:DeleteLaunchTemplate
                  - ec2:DeleteLaunchTemplateVersions
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteTags
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeTags
                  - ec2:DescribeVpcs
                  - ec2:ModifyLaunchTemplate
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                Resource: "*"

Outputs:
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  RunsTableName:
    Value: !Ref RunsTable
  RunnerImageUri:
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/arenabench/runner:latest
  # The compute environments are unnamed so Batch can replace them (see the
  # comment on OnDemandComputeEnvironment); these publish what CloudFormation
  # generated, for anyone who needs to find one in the console or the CLI.
  OnDemandComputeEnvironmentName:
    Value: !Ref OnDemandComputeEnvironment
  SpotComputeEnvironmentName:
    Value: !Ref SpotComputeEnvironment
  GpuComputeEnvironmentName:
    Value: !Ref GpuComputeEnvironment
  MeasureQueueArn:
    Value: !Ref MeasureQueue
  BurstQueueArn:
    Value: !Ref BurstQueue
  TuneQueueArn:
    Value: !Ref TuneQueue
  TrialJobDefinitionArn:
    Value: !Ref TrialJobDefinition
  SutBuildProjectName:
    Value: !Ref SutBuildProject
  RunnerImageProjectName:
    Value: !Ref RunnerImageProject
  GitHubDeployRoleArn:
    Description: >-
      Role .github/workflows/infra.yml assumes via GitHub OIDC to deploy
      this stack.
    Value: !GetAtt GitHubDeployRole.Arn
