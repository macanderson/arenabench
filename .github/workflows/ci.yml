# SPDX-License-Identifier: Apache-2.0
#
# ArenaBench CI — the whole gate for this repository. Written while
# arenabench still lived inside the stella monorepo (where a nested .github/
# is never read and this file was inert); since the ejection it runs as-is.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python — pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # ArenaBench is standard-library only, so there is no project to sync:
      # `pythonpath` in pyproject.toml makes the package importable straight
      # from the source tree.
      - name: pytest
        run: uv run --with pytest --no-project pytest -q

      - name: ruff
        run: uv run --with ruff --no-project ruff check .

      # The ArenaBench half of the role-names guard that split at ejection —
      # the stella repo's half covers its own producers. See the script's
      # header for the failure it catches.
      - name: role names have one spelling
        run: bash scripts/check-role-names.sh

  ui:
    name: ui — build the static client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # No dependencies — Node strips the type annotations natively — so these
      # run before `npm ci` and fail fast on a reading-tools regression or on
      # a port drifting from its vendored Rust golden (ui/golden/).
      - name: the transcript reading-tool checks pass
        working-directory: ui
        run: node scripts/check-transcript-view.mjs

      - name: the diff-view port matches the vendored Rust golden
        working-directory: ui
        run: node scripts/check-diff-view-parity.mjs

      - name: the word-highlight port matches the vendored Rust golden
        working-directory: ui
        run: node scripts/check-word-highlight-parity.mjs

      - name: npm ci
        working-directory: ui
        run: npm ci

      - name: typecheck
        working-directory: ui
        run: npm run typecheck

      # `build` exports the Next.js app and syncs it into arenabench/web/ —
      # the directory the Python server serves and the wheel ships. The
      # export is gitignored generated output, so this job is the proof that
      # the client builds from source and lands where the server serves.
      - name: build
        working-directory: ui
        run: npm run build

      - name: the export landed where the server serves from
        run: test -f arenabench/web/index.html
